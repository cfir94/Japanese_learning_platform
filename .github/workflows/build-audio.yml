name: Record Japanese audio

# 🔊 plays recorded files, because many phones have no Japanese voice for the browser.
# The voice service is not reachable from the build containers, so the files are recorded on
# GitHub's runners whenever the site's Japanese changes, and committed back to the same branch.
on:
  push:
    paths:
      - "src/data/**"
      - "src/logic/lesson.js"
      - "tools/collect_japanese.mjs"
      - "tools/build_audio.py"
      - ".github/workflows/build-audio.yml"
      - "!src/data/audio.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: node tools/collect_japanese.mjs > "$RUNNER_TEMP/ja.json"
      - run: python3 tools/build_audio.py "$RUNNER_TEMP/ja.json"
      - name: Commit the audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/audio src/data/audio.js
          if git diff --cached --quiet; then echo "audio already up to date"; exit 0; fi
          git commit -m "Record Japanese audio"
          git pull --rebase
          git push
