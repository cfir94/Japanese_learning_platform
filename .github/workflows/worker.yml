name: Deploy Gemini Worker (kotoba-api)

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotoba-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check that the deploy secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$GEMINI_API_KEY" ] || missing="$missing GEMINI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate application
        run: |
          npm test
          npm run check

      # Use only script-scoped APIs: no account-wide subdomain lookup or zone access.
      - name: Configure kotoba-api workers.dev endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://api.cloudflare.com/client/v4/accounts/' +
            process.env.CLOUDFLARE_ACCOUNT_ID + '/workers/scripts/kotoba-api/subdomain';
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ enabled: true, previews_enabled: false }),
            signal: AbortSignal.timeout(30000),
          });
          const data = await response.json();
          if (!response.ok || !data.success || !data.result?.enabled || data.result.previews_enabled) {
            throw new Error('kotoba-api endpoint configuration failed: HTTP ' + response.status);
          }
          console.log('kotoba-api workers.dev enabled; version previews disabled.');
          NODE

      - name: Upload Worker version and secret
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.40.0"
          command: versions upload
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/kotoba-worker-versions.jsonl

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/kotoba-worker-versions.jsonl
        run: |
          version_id="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const entries = readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8')
            .trim().split('\n').map(line => JSON.parse(line));
          const version = entries.filter(entry =>
            entry.type === 'version-upload' && entry.worker_name === 'kotoba-api').at(-1);
          if (!/^[0-9a-f-]{36}$/i.test(version?.version_id || '')) {
            throw new Error('No uploaded kotoba-api version ID was returned.');
          }
          console.log(version.version_id);
          NODE
          )"
          npx --no-install wrangler versions deploy "$version_id@100%" --yes

      - name: Health check
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://kotoba-api.cfir94.workers.dev/health', {
            signal: AbortSignal.timeout(30000),
          });
          const health = await response.json();
          if (!response.ok || health.ok !== true || !health.model) {
            throw new Error('kotoba-api health check failed: HTTP ' + response.status);
          }
          console.log(JSON.stringify(health));
          NODE

      # A fixed technical prompt only; this never writes a learning attempt to Supabase.
      - name: Gemini connection check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('worker/wrangler.jsonc', 'utf8')
            .split('\n').filter(line => !line.trim().startsWith('//')).join('\n'));
          const model = config.vars.GEMINI_MODEL;
          const base = 'https://generativelanguage.googleapis.com/v1beta/models/' + model;
          const metadataResponse = await fetch(base, {
            headers: { 'x-goog-api-key': process.env.GEMINI_API_KEY },
            signal: AbortSignal.timeout(30000),
          });
          const metadata = await metadataResponse.json();
          if (!metadataResponse.ok) {
            throw new Error('Gemini model access failed: HTTP ' + metadataResponse.status +
              ', status=' + (metadata.error?.status || 'unknown'));
          }
          if (!metadata.supportedGenerationMethods?.includes('generateContent')) {
            throw new Error('Configured Gemini model does not support generateContent.');
          }
          console.log(JSON.stringify({ modelAccess: true, model: metadata.name }));
          const response = await fetch(
            base + ':generateContent',
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-goog-api-key': process.env.GEMINI_API_KEY,
              },
              body: JSON.stringify({
                contents: [{ role: 'user', parts: [{ text: 'Technical connection check. Return {"ok":true}.' }] }],
                generationConfig: {
                  thinkingConfig: { thinkingLevel: 'low' },
                  responseMimeType: 'application/json',
                  responseSchema: { type: 'OBJECT', properties: { ok: { type: 'BOOLEAN' } }, required: ['ok'] },
                },
              }),
              signal: AbortSignal.timeout(90000),
            },
          );
          const data = await response.json();
          if (!response.ok) {
            throw new Error('Gemini connection check failed: HTTP ' + response.status +
              ', status=' + (data.error?.status || 'unknown') +
              ', message=' + (data.error?.message || 'unknown'));
          }
          const raw = data.candidates?.[0]?.content?.parts?.map(part => part.text || '').join('') || '';
          if (JSON.parse(raw).ok !== true) throw new Error('Unexpected Gemini connection-check response.');
          console.log(JSON.stringify({ ok: true, requestedModel: model, servedModel: data.modelVersion || null }));
          NODE

      # The site's real prompts and response schemas, on fixed sample sentences (no learner data):
      # proves the pinned model accepts them, not just a one-line test.
      - name: Grading prompts check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { SYSTEM, GRADE_SCHEMA, WRITE_SCHEMA, gradePrompt, writePrompt } from './worker/src/prompts.js';
          const config = JSON.parse(readFileSync('worker/wrangler.jsonc', 'utf8')
            .split('\n').filter(line => !line.trim().startsWith('//')).join('\n'));
          const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + config.vars.GEMINI_MODEL + ':generateContent';
          async function ask(text, schema) {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-goog-api-key': process.env.GEMINI_API_KEY },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: SYSTEM }] },
                contents: [{ role: 'user', parts: [{ text }] }],
                generationConfig: { thinkingConfig: { thinkingLevel: 'low' }, responseMimeType: 'application/json', responseSchema: schema },
              }),
              signal: AbortSignal.timeout(90000),
            });
            const data = await response.json();
            if (!response.ok) throw new Error('HTTP ' + response.status + ': ' + (data.error?.message || 'unknown'));
            return JSON.parse(data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '');
          }
          const graded = await ask(gradePrompt([{ id: 'x1', prompt: 'אני רוצה לאכול סושי.', target: 'Genki L11: 〜たい', models: ['すしが食べたいです。'], answer: 'すしを食べたい' }]), GRADE_SCHEMA);
          if (![0, 1, 2].includes(graded.results?.[0]?.score)) throw new Error('Unexpected grade: ' + JSON.stringify(graded));
          const written = await ask(writePrompt({ prompt: 'כתוב שני משפטים על סוף השבוע.', answer: '週末は海に行きました。楽しかったです。', catalog: 'g09-1: past short forms — עבר בצורה קצרה' }), WRITE_SCHEMA);
          if (typeof written.summary !== 'string' || !Array.isArray(written.errors)) throw new Error('Unexpected writing result');
          console.log(JSON.stringify({ grade: graded.results[0].score, writing: written.task_done }));
          NODE
